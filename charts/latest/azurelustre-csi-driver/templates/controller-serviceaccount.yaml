{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "azurelustre.serviceAccountNameController" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azurelustre.labels" . | nindent 4 }}
{{- include "azurelustre.imagePullSecrets" . }}
{{- end }}

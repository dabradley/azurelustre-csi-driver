---
# ServiceMonitor for Prometheus Operator auto-discovery of node metrics.
# Requires the Prometheus Operator CRDs to be installed in the cluster.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: csi-azurelustre-node
  namespace: kube-system
  labels:
    app: csi-azurelustre-node
    release: prometheus
spec:
  selector:
    matchLabels:
      app: csi-azurelustre-node
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: metrics
      interval: 15s

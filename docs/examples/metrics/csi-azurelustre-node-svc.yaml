---
# Service exposing the node DaemonSet Prometheus metrics endpoint.
# Apply this to enable Prometheus service-based discovery for node pods.
apiVersion: v1
kind: Service
metadata:
  name: csi-azurelustre-node-metrics
  namespace: kube-system
  labels:
    app: csi-azurelustre-node
spec:
  selector:
    app: csi-azurelustre-node
  ports:
    - name: metrics
      port: 29765
      targetPort: 29765
  type: ClusterIP
